<!doctype html>
<html lang="en" id="komixy" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Komixy</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Le traduzioni servono prima di mostrare qualsiasi pagina: partono insieme al JavaScript e non dopo -->
    <link rel="preload" href="./i18n/it.json" as="fetch" crossorigin />
    <!-- Il font parte subito, senza aspettare che il CSS sia letto -->
    <link
      rel="preload"
      href="/fonts/mulish-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Lo sfondo scuro c'è dal primo disegno: il CSS completo arriva dopo e il suo sfondo (base.css) non è nel CSS inline di avvio, quindi lo skeleton starebbe su bianco */
      html.dark {
        background-color: var(--color-surface-950);
      }
      /* Con lo skeleton di avvio presente la pagina vera resta nascosta, poi lo skeleton si toglie */
      body:has(#skeleton) > app-root {
        display: none;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
    <!--
      Skeleton mostrato finché la prima pagina non è pronta. Sta FUORI da <app-root> e lo toglie
      `provideBootSkeleton` (core/providers/boot-skeleton) dopo la prima navigazione: se fosse dentro,
      Angular lo cancellerebbe subito e, mentre arrivano i chunk lazy, resterebbe solo lo sfondo viola.
      Finché c'è, <app-root> è nascosto dal CSS nell'<head>.
      È solo decorativo (aria-hidden) e usa le stesse misure della pagina vera (sidebar w-64, nav mobile h-14)
      per non far "saltare" il layout. La variante si sceglie con data-variant sul div #skeleton, dall'indirizzo:
        discover (default) · ranking · detail · placeholder   con il menu (Scopri, Classifica, dettaglio fumetto, Profilo/Libreria/Uscite/elenco fumetti)
        login · authtext · pack · notfound                    senza menu (accesso, Registrati e Password dimenticata, busta a schermo intero, 404)
      Altri due attributi, letti dallo storage dallo script: data-guest (ospite o iscritto) e data-pack (busta della
      settimana sigillata o aperta). Cambiano le pagine con l'avviso per gli ospiti e la busta: Scopri, Classifica, dettaglio.
      Per adattarlo a una pagina nuova:
        1. aggiungi un blocco con `group-data-[variant=<nome>]/skel:...` (le misure vengono dai template veri);
        2. aggiungi la rotta nella funzione dello script sotto lo skeleton;
        3. se la pagina non ha il menu, aggiungi la variante a quelle nascoste nel primo blocco.
    -->
    <div
      id="skeleton"
      class="group/skel"
      data-variant="discover"
      data-guest="true"
      data-pack="sealed"
      aria-hidden="true"
    >
      <!-- Pagine con menu: sidebar da 1024px in su, barra in basso sotto. Senza menu: accesso, auth di testo, busta, 404 -->

        class="min-h-dvh animate-pulse group-data-[variant=authtext]/skel:hidden group-data-[variant=login]/skel:hidden group-data-[variant=notfound]/skel:hidden group-data-[variant=pack]/skel:hidden motion-reduce:animate-none lg:flex lg:gap-1 lg:py-2 lg:pl-2"
      >
        <div
          class="sticky top-4 hidden h-[calc(100dvh-2rem)] w-64 shrink-0 rounded-xl border border-surface-50/10 bg-surface-950/70 lg:block"
        ></div>

        <div class="min-w-0 flex-1 space-y-8 px-3 py-2 md:p-2">
          <!-- discover: titolo, schede Manga/Fumetti, ricerca con filtri, busta della settimana e file di card -->
          <div class="hidden space-y-8 group-data-[variant=discover]/skel:block">

                ></div>

                ></div>

              <div class="grid grid-cols-1 gap-2 md:grid-flow-col md:grid-cols-2 md:grid-rows-5">

          <!-- detail: freccia indietro con titolo, copertina e dati del volume, due bottoni e l'avviso per gli ospiti -->

            <div
              class="h-14.25 rounded-xl border border-primary-400/20 bg-surface-900 group-data-[guest=false]/skel:hidden max-[380px]:h-19 sm:h-9.25"
            ></div>

          <!-- placeholder: titolo e riquadro centrato con cerchio, titolo e descrizione (Profilo, Libreria, Uscite) -->
          <div class="hidden space-y-6 group-data-[variant=placeholder]/skel:block">
            <div class="space-y-2">
              <div class="h-6 w-40 rounded-md bg-surface-800"></div>
              <div class="h-4 w-56 max-w-full rounded-md bg-surface-800/70"></div>
            </div>
            <div
              class="mx-auto flex min-h-[60dvh] max-w-md flex-col items-center justify-center gap-4 px-4"
            >
              <div
                class="size-20 rounded-full border border-primary-400/20 bg-surface-900 md:size-24"
              ></div>
              <div class="h-6 w-32 rounded-md bg-surface-800 md:h-7"></div>
              <!-- Descrizione su due righe sotto il tablet, su una da md in su (come va a capo la vera) -->
              <div class="flex h-10 w-full flex-col justify-center gap-1 md:h-5">

      <!-- pack (busta a schermo intero): intestazione, busta al centro e, in basso, suggerimento e bottoni -->

      <!--
        login: stesse classi di login-page, login-volumes e login-form (variabili --cw/--logo/--s1..3 comprese), con righe alte quanto il testo (h-lh).
        Sotto i 768px una colonna senza card (marchio, titolo, invito, copertine, pausa, campi, social, registrati); da 768px due colonne: marchio a sinistra, card a destra.
      -->
      <main
        class="relative hidden h-dvh animate-pulse flex-col items-center justify-start gap-4 overflow-hidden p-6 group-data-[variant=login]/skel:flex motion-reduce:animate-none max-sm:gap-(--s1) max-sm:pt-(--s3) max-sm:pb-[calc(var(--s1)*0.5)] max-sm:[--cw:max(3rem,min(7rem,calc(19.6dvh-70.7px),calc(3rem+0.45*(100dvh-40rem)),calc((100vw-2rem)/4)))] max-sm:[--logo:clamp(1.75rem,calc(9.06dvh-32.4px),3.25rem)] max-sm:[--s1:clamp(0.5rem,calc(3.02dvh-12.1px),1rem)] max-sm:[--s2:clamp(0.75rem,calc(4.53dvh-18.2px),1.5rem)] max-sm:[--s3:clamp(1rem,calc(6.04dvh-24.3px),2rem)] sm:gap-6 sm:py-8 md:grid-cols-2 md:items-stretch md:justify-normal md:gap-0 md:overflow-y-hidden md:p-0 group-data-[variant=login]/skel:md:grid"
      >

    <script>
      // Sceglie lo skeleton dall'indirizzo (come le rotte di app.routes.ts: la radice porta alla login, il resto che non esiste è la 404)
      (function () {
        var skeleton = document.getElementById('skeleton');
        if (!skeleton) return;
        var parts = location.pathname.split('/').filter(Boolean);
        var first = parts[0];
        var second = parts[1];
        var variant;
        if (!first || first === 'login') {
          variant = second === 'register' || second === 'forgot-password' ? 'authtext' : 'login';
        } else if (first === 'discover') {
          variant = second === 'ranking' ? 'ranking' : second === 'pack' ? 'pack' : 'discover';
        } else if (first === 'comic') {
          variant = second ? 'detail' : 'placeholder';
        } else if (first === 'profile' || first === 'library' || first === 'releases') {
          variant = 'placeholder';
        } else {
          variant = 'notfound';
        }
        skeleton.setAttribute('data-variant', variant);

        // Ospite e busta della settimana, come li legge l'app dallo storage: SessionService (komixy.session) e
        // WeeklyPackService (komixy.weeklyPack, settimana ISO nel fuso Europe/Rome, come iso-week.ts)
        var guest = true;
        var opened = false;
        try {
          guest = localStorage.getItem('komixy.session') !== 'true';
          var saved = JSON.parse(localStorage.getItem('komixy.weeklyPack') || 'null');
          var parts = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Europe/Rome',
            year: 'numeric',
            month: 'numeric',
            day: 'numeric',
          }).formatToParts(new Date());
          var part = function (type) {
            return Number(
              parts.filter(function (p) {
                return p.type === type;
              })[0].value,
            );
          };
          var day = new Date(Date.UTC(part('year'), part('month') - 1, part('day')));
          var thursday = new Date(day.getTime());
          thursday.setUTCDate(thursday.getUTCDate() + 4 - (day.getUTCDay() || 7));
          var year = thursday.getUTCFullYear();
          var week = Math.ceil(((thursday.getTime() - Date.UTC(year, 0, 1)) / 86400000 + 1) / 7);
          opened = !!saved && saved.week === year + '-W' + week;
        } catch (e) {
          // Storage o Intl non disponibili: ospite con la busta da aprire, come parte l'app
        }
        skeleton.setAttribute('data-guest', String(guest));
        skeleton.setAttribute('data-pack', opened ? 'opened' : 'sealed');
      })();
    </script>
