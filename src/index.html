<!doctype html>
<html lang="it" id="komixy" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Komixy</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Le traduzioni servono prima di mostrare qualsiasi pagina: partono insieme al JavaScript e non dopo -->
    <link rel="preload" href="./i18n/it.json" as="fetch" crossorigin />
    <!-- Il font parte subito, senza aspettare che il CSS sia letto -->
    <link
      rel="preload"
      href="/fonts/mulish-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Con lo skeleton di avvio presente la pagina vera resta nascosta, poi lo skeleton si toglie */
      body:has(#skeleton) > app-root {
        display: none;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
    <!--
      Skeleton mostrato finché la prima pagina non è pronta. Sta FUORI da <app-root> e lo toglie
      `provideBootSkeleton` (core/providers/boot-skeleton) dopo la prima navigazione: se fosse dentro,
      Angular lo cancellerebbe subito e, mentre arrivano i chunk lazy, resterebbe solo lo sfondo viola.
      Finché c'è, <app-root> è nascosto dal CSS nell'<head>.
      È solo decorativo (aria-hidden) e usa le stesse misure della pagina vera (sidebar w-64, nav mobile h-14)
      per non far "saltare" il layout. La variante si sceglie con data-variant sul div #skeleton.
      Per adattarlo a una pagina nuova:
        1. aggiungi un blocco con `group-data-[variant=<nome>]/skel:...` (come "list" e "placeholder" qui sotto);
        2. aggiungi la rotta nella mappa dello script sotto lo skeleton.
      "list" è la variante di default (Scopri, Classifica) e vale anche per le rotte non in mappa; "placeholder" è per Profilo, Libreria e Uscite.
    -->
    <div id="skeleton" class="group/skel" data-variant="list" aria-hidden="true">
      <!-- Pagine con menu (tutte tranne login): sidebar da 1024px in su, barra in basso sotto -->
      <div
        class="min-h-dvh animate-pulse motion-reduce:animate-none group-data-[variant=login]/skel:hidden lg:flex lg:gap-1 lg:py-2 lg:pl-2"
      >
        <div
          class="sticky top-4 hidden h-[calc(100dvh-2rem)] w-64 shrink-0 rounded-xl border border-surface-50/10 bg-surface-950/70 lg:block"
        ></div>

        <div class="min-w-0 flex-1 space-y-8 px-3 py-2 md:p-2">
          <!-- list: titolo, classifica (5 card su telefono, 6 su due colonne da tablet) con il bottone «vedi tutte» e una fila di card -->
          <div class="hidden space-y-8 group-data-[variant=list]/skel:block">
            <div class="space-y-4">
              <div class="flex items-end justify-between gap-3">
                <div class="space-y-2">
                  <div class="h-6 w-56 rounded-md bg-surface-800"></div>
                  <div class="h-4 w-40 rounded-md bg-surface-800/70"></div>
                </div>
                <div
                  class="h-11 w-56 shrink-0 rounded-full border border-primary-400/20 bg-surface-900 max-md:hidden"
                ></div>
              </div>
              <div class="grid grid-cols-1 gap-2 md:grid-cols-2">
                <div
                  class="h-31.5 rounded-xl border border-primary-400/20 bg-surface-900 md:h-34.5"
                ></div>
                <div
                  class="h-31.5 rounded-xl border border-primary-400/20 bg-surface-900 md:h-34.5"
                ></div>
                <div
                  class="h-31.5 rounded-xl border border-primary-400/20 bg-surface-900 md:h-34.5"
                ></div>
                <div
                  class="h-31.5 rounded-xl border border-primary-400/20 bg-surface-900 md:h-34.5"
                ></div>
                <div
                  class="h-31.5 rounded-xl border border-primary-400/20 bg-surface-900 md:h-34.5"
                ></div>
                <div
                  class="h-31.5 rounded-xl border border-primary-400/20 bg-surface-900 max-md:hidden md:h-34.5"
                ></div>
              </div>
              <div
                class="h-11 rounded-full border border-primary-400/20 bg-surface-900 md:hidden"
              ></div>
            </div>
            <div class="space-y-4">
              <div class="space-y-2">
                <div class="h-6 w-48 rounded-md bg-surface-800"></div>
                <div class="h-4 w-64 max-w-full rounded-md bg-surface-800/70"></div>
              </div>
              <div class="flex gap-2 overflow-hidden">
                <div
                  class="h-64.5 w-40 shrink-0 rounded-xl border border-primary-400/20 bg-surface-900 lg:w-44"
                ></div>
                <div
                  class="h-64.5 w-40 shrink-0 rounded-xl border border-primary-400/20 bg-surface-900 lg:w-44"
                ></div>
                <div
                  class="h-64.5 w-40 shrink-0 rounded-xl border border-primary-400/20 bg-surface-900 lg:w-44"
                ></div>
                <div
                  class="h-64.5 w-40 shrink-0 rounded-xl border border-primary-400/20 bg-surface-900 lg:w-44"
                ></div>
              </div>
            </div>
          </div>

          <!-- placeholder: titolo e riquadro centrato con cerchio, titolo e descrizione (Profilo, Libreria, Uscite) -->
          <div class="hidden space-y-6 group-data-[variant=placeholder]/skel:block">
            <div class="space-y-2">
              <div class="h-6 w-40 rounded-md bg-surface-800"></div>
              <div class="h-4 w-56 max-w-full rounded-md bg-surface-800/70"></div>
            </div>
            <div
              class="mx-auto flex min-h-[60dvh] max-w-md flex-col items-center justify-center gap-4 px-4"
            >
              <div
                class="size-20 rounded-full border border-primary-400/20 bg-surface-900 md:size-24"
              ></div>
              <div class="h-6 w-32 rounded-md bg-surface-800 md:h-7"></div>
              <!-- Descrizione su due righe sotto il tablet, su una da md in su (come va a capo la vera) -->
              <div class="flex h-10 w-full flex-col justify-center gap-1 md:h-5">
                <div class="h-4 rounded-md bg-surface-800/70"></div>
                <div class="h-4 w-2/3 self-center rounded-md bg-surface-800/70 md:hidden"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Barra mobile: due voci per lato e il tasto Scan al centro, come quella vera -->
        <div
          class="fixed inset-x-2 bottom-6 grid h-14 grid-cols-5 items-center rounded-full border border-primary-400/15 bg-surface-900/60 px-4 lg:hidden"
        >
          <div class="col-span-2 flex items-center justify-around pr-5">
            <div class="flex flex-col items-center gap-1">
              <div class="size-6 rounded-md bg-surface-800"></div>
              <div class="h-3 w-9 rounded-md bg-surface-800/70"></div>
            </div>
            <div class="flex flex-col items-center gap-1">
              <div class="size-6 rounded-md bg-surface-800"></div>
              <div class="h-3 w-9 rounded-md bg-surface-800/70"></div>
            </div>
          </div>
          <div
            class="absolute left-1/2 top-1/2 size-20 -translate-x-1/2 -translate-y-1/2 rounded-full border-4 border-surface-900 bg-surface-800"
          ></div>
          <div class="col-span-2 col-start-4 flex items-center justify-around pl-5">
            <div class="flex flex-col items-center gap-1">
              <div class="size-6 rounded-md bg-surface-800"></div>
              <div class="h-3 w-9 rounded-md bg-surface-800/70"></div>
            </div>
            <div class="flex flex-col items-center gap-1">
              <div class="size-6 rounded-md bg-surface-800"></div>
              <div class="h-3 w-9 rounded-md bg-surface-800/70"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- login: sotto 1024px una colonna centrata senza card (marchio, titolo, invito, copertine, campi); da 1024px pannello di marca a sinistra e card a destra, senza menu -->
      <div
        class="hidden h-dvh animate-pulse flex-col items-center justify-start gap-4 overflow-hidden px-6 py-6 motion-reduce:animate-none group-data-[variant=login]/skel:flex sm:gap-6 sm:py-8 group-data-[variant=login]/skel:lg:grid lg:grid-cols-2 lg:justify-normal lg:gap-0 lg:p-0"
      >
        <!-- Stesse misure di login-volumes: marchio, titolo e sottotitolo (solo da 1024px), invito e copertine -->
        <div
          class="flex flex-col justify-center max-lg:contents lg:gap-[3dvh] lg:px-12 lg:py-[6dvh] xl:px-20"
        >
          <div class="flex items-center justify-center gap-3 lg:justify-start">
            <div class="size-10 rounded-xl bg-surface-800"></div>
            <div class="h-6 w-16.5 rounded-md bg-surface-800"></div>
          </div>
          <div class="max-w-xl space-y-3 text-center">
            <div
              class="flex h-12.5 flex-col items-center justify-center gap-2 sm:h-18.75 sm:gap-3 lg:h-[min(11.25rem,22.5dvh)] lg:items-stretch lg:gap-[min(0.75rem,1.5dvh)]"
            >
              <div class="h-5 w-full rounded-md bg-surface-800 sm:h-9 lg:h-[min(2.25rem,4.5dvh)]"></div>
              <div class="h-5 w-4/5 rounded-md bg-surface-800 sm:h-9 lg:h-[min(2.25rem,4.5dvh)]"></div>
              <div class="hidden h-9 w-2/3 rounded-md bg-surface-800 lg:block lg:h-[min(2.25rem,4.5dvh)]"></div>
            </div>
            <div class="hidden h-14 flex-col justify-center gap-2 lg:flex">
              <div class="h-4 rounded-md bg-surface-800/70"></div>
              <div class="h-4 w-2/3 rounded-md bg-surface-800/70"></div>
            </div>
          </div>
          <div class="h-5 w-63 max-w-full rounded-md bg-surface-800/70 lg:self-start"></div>
          <div
            class="flex h-[min(12rem,23dvh)] items-end justify-center -space-x-6 sm:h-[min(18rem,28dvh)] sm:-space-x-8 lg:h-[min(18rem,32dvh)] lg:justify-start lg:-space-x-3"
          >
            <div
              class="aspect-2/3 w-[min(5.5rem,12.5dvh)] rounded-lg bg-surface-800 sm:w-[min(11rem,17dvh)] lg:w-[min(9rem,15dvh)]"
            ></div>
            <div
              class="aspect-2/3 w-[min(5.5rem,12.5dvh)] rounded-lg bg-surface-800 sm:w-[min(11rem,17dvh)] lg:w-[min(9rem,15dvh)]"
            ></div>
            <div
              class="aspect-2/3 w-[min(5.5rem,12.5dvh)] rounded-lg bg-surface-800 sm:w-[min(11rem,17dvh)] lg:w-[min(9rem,15dvh)]"
            ></div>
            <div
              class="aspect-2/3 w-[min(5.5rem,12.5dvh)] rounded-lg bg-surface-800 sm:w-[min(11rem,17dvh)] lg:w-[min(9rem,15dvh)]"
            ></div>
          </div>
        </div>

        <!-- Stesse misure di login-page e login-form: titolo, sottotitolo (solo da 1024px), due campi e bottone -->
        <div class="max-lg:contents lg:flex lg:items-center lg:justify-center lg:px-8 lg:py-10">
          <div
            class="max-lg:contents lg:w-full lg:max-w-md lg:rounded-3xl lg:border lg:border-primary-400/20 lg:bg-surface-900/65 lg:px-10 lg:py-10"
          >
            <div class="hidden h-9 items-center lg:flex">
              <div class="h-6 w-24 rounded-md bg-surface-800 lg:h-7"></div>
            </div>
            <div class="mb-8 mt-3 hidden h-6 items-center lg:flex">
              <div class="h-4 w-full rounded-md bg-surface-800/70"></div>
            </div>
            <div class="flex w-full max-w-sm flex-col gap-5 lg:max-w-none">
              <div class="flex flex-col gap-2">
                <div class="h-5 w-16 rounded-md bg-surface-800/70"></div>
                <div class="h-10.5 rounded-xl bg-surface-800/70"></div>
              </div>
              <div class="flex flex-col gap-2">
                <div class="h-5 w-20 rounded-md bg-surface-800/70"></div>
                <div class="h-10.5 rounded-xl bg-surface-800/70"></div>
              </div>
              <div class="mt-2 h-11 rounded-full bg-surface-800"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Sceglie lo skeleton dal primo segmento dell'indirizzo (rotte non in mappa = "list"; la radice porta alla login)
      (function () {
        var variants = {
          '': 'login',
          login: 'login',
          profile: 'placeholder',
          library: 'placeholder',
          releases: 'placeholder',
        };
        var skeleton = document.getElementById('skeleton');
        var variant = variants[location.pathname.split('/')[1]];
        if (skeleton && variant) skeleton.setAttribute('data-variant', variant);
      })();
    </script>
  </body>
</html>
