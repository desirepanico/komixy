<div class="min-h-dvh">
  <!-- DESKTOP: da 1024px in su -->
  @if (viewport.isDesktop()) {
    <div class="flex min-h-dvh gap-1 py-2 pl-2">
      <app-desktop-sidebar />

      <main class="min-w-0 flex-1">
        <router-outlet />
      </main>
    </div>
  }

  <!-- TABLET + MOBILE: sotto i 1024px -->
  @else {
    <div class="min-h-dvh">
      <main
        appSwipe
        class="min-h-dvh touch-pan-y pb-20 [view-transition-name:page]"
        (swipeLeft)="swipeService.navigate('left')"
        (swipeRight)="swipeService.navigate('right')"
      >
        <router-outlet />
      </main>

      <app-mobile-bottom-nav />
    </div>
  }
</div>
