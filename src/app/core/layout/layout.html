<div class="min-h-dvh">

      <!-- SIDEBAR -->
      <aside class="fixed inset-y-0 left-0 z-40 w-72">
        TODO SIDE_BAR
        <!-- <app-desktop-sidebar /> -->
      </aside>

      <!-- CONTENUTO DESKTOP -->
      <main class="ml-72 min-h-dvh flex-1">

  <!-- MOBILE + TABLET -->
  @else {
    <div class="min-h-dvh">

      <main class="min-h-dvh pb-20">

      <app-mobile-bottom-nav />

  }
