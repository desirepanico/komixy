<div class="min-h-dvh">
  <!-- DESKTOP: da 1024px in su -->
  @if (viewport.isDesktop()) {
    <div class="flex min-h-dvh gap-4 p-4">
      <!-- SIDEBAR -->

      <app-desktop-sidebar />

      <!-- CONTENUTO DESKTOP -->
      <main class="flex-1">
        <router-outlet />
      </main>
    </div>
  }

  <!-- TABLET + MOBILE: sotto i 1024px -->
  @else {
    <div class="min-h-dvh">
      <!-- CONTENUTO -->
      <main class="min-h-dvh pb-20">
        <router-outlet />
      </main>

      <!-- BOTTOM NAV -->
      <app-mobile-bottom-nav />
    </div>
  }
</div>
