<nav
  class="fixed inset-x-2 bottom-6 z-50 grid h-14 grid-cols-5 items-center rounded-full border border-primary-400/15 bg-surface-900/60 px-4 glass-strong shadow-[0_14px_32px_color-mix(in_srgb,var(--p-surface-950)_75%,transparent),0_4px_16px_color-mix(in_srgb,var(--p-primary-800)_20%,transparent)] transition-shadow duration-200"
>
  <!-- SINISTRA -->
  <div class="col-span-2 flex gap-2 items-center justify-around pr-5">
    @for (item of navItems().slice(0, 2); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="text-primary-400 [&>span]:font-bold"
        [routerLinkActiveOptions]="{ exact: item.route === '' }"
        class="flex flex-col items-center justify-center gap-0.5 text-neutral-500 transition-colors"
      >
        <ng-icon [name]="item.icon" size="24" />

        <span class="text-xs font-semibold transition-all">
          {{ item.label | transloco }}
        </span>
      </a>
    }
  </div>

  <!-- SCAN -->
  <a
    [routerLink]="appRoutes().Scan"
    routerLinkActive="bg-primary-500 text-surface-800"
    class="absolute left-1/2 top-1/2 z-10 flex size-20 -translate-x-1/2 -translate-y-1/2 flex-col items-center justify-center rounded-full border-4 border-surface-900 bg-primary-400 text-surface-900 shadow-lg shadow-primary-950/50 ring-1 ring-primary-300/30 transition-all duration-200 hover:bg-primary-300 active:scale-95"
  >
    <ng-icon name="matBarcodeScannerOutline" size="24" />

    <span class="text-xs font-semibold">
      {{ 'menu.scan' | transloco }}
    </span>
  </a>

  <!-- DESTRA -->
  <div class="col-start-4 col-span-2 flex gap-2 items-center justify-around pl-5">
    @for (item of navItems().slice(2); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="text-primary-400 [&>span]:font-bold"
        class="flex flex-col items-center justify-center gap-0.5 text-neutral-500 transition-colors"
      >
        <ng-icon [name]="item.icon" size="24" />

        <span class="text-xs font-semibold transition-all">
          {{ item.label | transloco }}
        </span>
      </a>
    }
  </div>
</nav>
