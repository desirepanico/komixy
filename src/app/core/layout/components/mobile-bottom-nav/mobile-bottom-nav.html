<nav
  class="glass-strong fixed inset-x-2 bottom-6 z-50 grid h-14 grid-cols-5 items-center rounded-full border border-primary-400/15 bg-surface-900/60 px-4 shadow-[0_14px_32px_color-mix(in_srgb,var(--color-surface-950)_75%,transparent),0_4px_16px_color-mix(in_srgb,var(--color-primary-800)_20%,transparent)] transition-shadow duration-200 [view-transition-name:mobile-nav]"
>
  <div class="col-span-2 flex items-center justify-around gap-2 pr-5">
    @for (item of navItems.slice(0, 2); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive
        #rla="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: item.route === '' }"
        class="flex flex-col items-center justify-center gap-0.5 rounded-lg transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400"
        [class.text-primary-400]="rla.isActive"
        [class.text-surface-500]="!rla.isActive"
      >
        <ng-icon [name]="item.icon" size="24" />

        <span
          class="text-xs transition-all"
          [class.font-bold]="rla.isActive"
          [class.font-semibold]="!rla.isActive"
        >
          {{ item.label | transloco }}
        </span>
      </a>
    }
  </div>

  <a
    [routerLink]="AppRoutes.Scan"
    routerLinkActive="bg-primary-500 text-surface-800"
    class="absolute top-1/2 left-1/2 z-10 flex size-20 -translate-1/2 flex-col items-center justify-center rounded-full border-4 border-surface-900 bg-primary-400 text-surface-900 shadow-lg ring-1 shadow-primary-950/50 ring-primary-300/30 transition-all duration-200 hover:bg-primary-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 active:scale-95"
  >
    <ng-icon name="matBarcodeScannerOutline" size="24" />

    <span class="text-xs font-semibold">
      {{ 'menu.scan' | transloco }}
    </span>
  </a>

  <div class="col-span-2 col-start-4 flex items-center justify-around gap-2 pl-5">
    @for (item of navItems.slice(2); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive
        #rla="routerLinkActive"
        class="flex flex-col items-center justify-center gap-0.5 rounded-lg transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400"
        [class.text-primary-400]="rla.isActive"
        [class.text-surface-500]="!rla.isActive"
      >
        <ng-icon [name]="item.icon" size="24" />

        <span
          class="text-xs transition-all"
          [class.font-bold]="rla.isActive"
          [class.font-semibold]="!rla.isActive"
        >
          {{ item.label | transloco }}
        </span>
      </a>
    }
  </div>
</nav>
