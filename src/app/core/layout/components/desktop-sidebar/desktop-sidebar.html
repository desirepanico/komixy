<aside
  class="sticky top-4 z-40 flex h-[calc(100dvh-2rem)] w-64 shrink-0 flex-col rounded-xl border border-surface-50/10 bg-surface-950/70 glass-strong transition-all duration-300"
>
  <div class="flex h-20 shrink-0 items-center px-5">
    <a
      routerLink="/"
      class="flex items-center rounded-xl focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400"
      [attr.aria-label]="'common.brand' | transloco"
    >
      <app-brand />
    </a>
  </div>

  <nav class="flex-1 overflow-y-auto px-3 py-4">
    <div class="flex flex-col gap-4">
      @for (group of navGroups(); track group.title) {
        <section>
          <button
            type="button"
            class="mb-2 flex h-11 w-full cursor-pointer items-center justify-between rounded-full px-4 text-left text-xs font-bold tracking-wider text-surface-300 uppercase transition-colors duration-200 hover:bg-surface-800/70 hover:text-surface-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400"
            [attr.aria-expanded]="group.expandable"
            [attr.aria-controls]="'nav-group-' + group.title"
            (click)="toggleGroup(group)"
          >
            <span>{{ group.title | transloco }}</span>

            <ng-icon
              name="matKeyboardArrowDownOutline"
              size="14"
              class="transition-transform duration-200"
            />
          </button>
          @if (group.expandable) {
            <ul [id]="'nav-group-' + group.title" class="flex flex-col gap-1">
              @for (item of group.items; track item.route) {
                <li>
                  <a
                    [routerLink]="item.route"
                    [routerLinkActiveOptions]="{
                      exact: item.route === '/',
                    }"
                    routerLinkActive
                    ariaCurrentWhenActive="page"
                    class="group flex items-center gap-3 rounded-full px-4 py-2.5 text-sm font-medium text-surface-400 transition-colors duration-200 not-aria-[current=page]:hover:bg-surface-800/70 not-aria-[current=page]:hover:text-surface-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 aria-[current=page]:bg-primary-500/20 aria-[current=page]:font-semibold aria-[current=page]:text-primary-200"
                  >
                    <ng-icon [name]="item.icon" size="16" />
                    <span>{{ item.label | transloco }}</span>
                  </a>
                </li>
              }
            </ul>
          }
        </section>
      }
    </div>
  </nav>

  <div class="border-t border-surface-700/40 p-3">
    <a
      [routerLink]="profileLink"
      routerLinkActive
      ariaCurrentWhenActive="page"
      class="flex w-full items-center gap-3 rounded-full p-2.5 pr-4 text-left transition-colors duration-200 not-aria-[current=page]:hover:bg-surface-800/70 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 aria-[current=page]:bg-primary-500/20"
    >
      <span
        class="flex size-8 shrink-0 items-center justify-center rounded-full bg-primary-500 text-sm font-semibold text-surface-950"
        aria-hidden="true"
        >DP</span
      >

      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-semibold text-surface-100">
          {{ 'menu.myProfile' | transloco }}
        </p>
        <p class="truncate text-xs text-surface-500">{{ 'menu.viewProfile' | transloco }}</p>
      </div>

      <ng-icon name="matChevronRightOutline" size="20" class="text-surface-500" />
    </a>
  </div>
</aside>
