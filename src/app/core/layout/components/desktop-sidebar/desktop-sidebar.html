<aside
  class="fixed left-0 top-0 z-40 flex h-dvh w-64 flex-col border-r border-surface-700/20 bg-surface-950/40 backdrop-blur-2xl"
>
  <!-- Logo -->
  <div class="flex h-20 shrink-0 items-center px-5">
    <a routerLink="/" class="flex items-center gap-3" aria-label="Komixy">
      <div
        class="flex size-10 items-center justify-center rounded-xl bg-primary-500 text-surface-950 shadow-lg shadow-primary-900/20"
      >
        <i class="pi pi-book text-lg"></i>
      </div>

      <span class="text-xl font-bold tracking-tight text-surface-50"> Komixy </span>
    </a>
  </div>

  <!-- Navigazione -->
  <nav class="flex-1 overflow-y-auto px-3 py-4">
    <div class="flex flex-col gap-4">
      @for (group of navGroups(); track group.title) {
        <section class="">
          <div class="mb-2">
            <span class="text-xs font-bold uppercase tracking-wider text-surface-500">
              {{ group.title | transloco }}
            </span>
          </div>

          <ul class="flex flex-col gap-1">
            @for (item of group.items; track item.route) {
              <li>
                <a
                  [routerLink]="item.route"
                  [routerLinkActiveOptions]="{ exact: item.route === '/' }"
                  #rla="routerLinkActive"
                  [routerLinkActive]="['bg-primary-500/15', 'text-primary-300']"
                  [class.hover:bg-surface-800/70]="!rla.isActive"
                  [class.hover:text-surface-100]="!rla.isActive"
                  class="group flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-surface-400 transition-colors duration-200"
                >
                  <ng-icon [name]="item.icon" size="16" />
                  <span>{{ item.label | transloco }}</span>
                </a>
              </li>
            }
          </ul>
        </section>
      }
    </div>
  </nav>

  <!-- Profilo -->
  <div class="border-t border-surface-700/40 p-3">
    <button
      type="button"
      class="flex w-full items-center gap-3 rounded-xl p-2.5 text-left transition-colors hover:bg-surface-800/70"
    >
      <p-avatar label="DP" shape="circle" class="bg-primary-500 text-surface-950" />

      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-semibold text-surface-100">Il mio profilo</p>

        <p class="truncate text-xs text-surface-500">Visualizza profilo</p>
      </div>

      <i class="pi pi-angle-right text-surface-500"></i>
    </button>
  </div>
</aside>
