<main
  class="relative flex min-h-[calc(100dvh-2rem)] items-center justify-center overflow-hidden px-4 py-10 sm:px-8"
>
  <div
    aria-hidden="true"
    class="pointer-events-none absolute left-1/2 top-1/2 h-72 w-72 -translate-x-1/2 -translate-y-1/2 rounded-full bg-primary-600/10 blur-3xl sm:h-96 sm:w-96"
  ></div>

  <section
    class="glass-strong relative w-full max-w-2xl rounded-3xl border border-primary-400/20 bg-surface-900/65 px-5 py-10 text-center sm:px-12 sm:py-14"
    aria-labelledby="not-found-title"
  >
    <div
      class="mx-auto mb-6 flex size-16 items-center justify-center rounded-2xl border border-primary-400/25 bg-primary-500/10 text-primary-300 sm:size-20"
      aria-hidden="true"
    >
      <ng-icon name="matExploreOutline" size="2.5rem" />
    </div>

    <p
      class="bg-linear-to-b from-primary-200 to-primary-500 bg-clip-text text-7xl font-extrabold tracking-tight text-transparent sm:text-9xl"
      aria-label="404"
    >
      {{ 'notFound.code' | transloco }}
    </p>

    <h1
      id="not-found-title"
      class="mt-5 text-2xl font-bold tracking-tight text-surface-50 sm:text-3xl"
    >
      {{ 'notFound.title' | transloco }}
    </h1>

    <p class="mx-auto mt-4 max-w-md text-sm leading-7 text-surface-300 sm:text-base">
      {{ 'notFound.description' | transloco }}
    </p>

    <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
      <a appButton [rounded]="true" [routerLink]="navigation.homeLink" class="w-full sm:w-auto">
        <ng-icon name="matExploreOutline" size="1.125rem" />
        {{ 'notFound.backHome' | transloco }}
      </a>
    </div>
  </section>
</main>
