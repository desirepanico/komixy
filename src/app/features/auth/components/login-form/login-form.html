<form class="flex flex-col gap-5" [formRoot]="form">
  <app-field-wrapper label="login.email" inputId="login-email" [error]="emailError()">
    <app-input-text
      inputId="login-email"
      type="email"
      autocomplete="email"
      inputmode="email"
      placeholder="login.emailPlaceholder"
      [formField]="form.email"
    />
  </app-field-wrapper>

  <app-field-wrapper
    label="login.password"
    inputId="login-password"
    [error]="passwordError()"
    [errorParams]="{ min: passwordMinLength }"
  >
    <app-input-password inputId="login-password" [formField]="form.password" />
  </app-field-wrapper>

  <button appButton type="submit" [rounded]="true" class="mt-2 w-full">
    {{ 'login.submit' | transloco }}
  </button>
</form>
