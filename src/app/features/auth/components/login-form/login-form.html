<form class="flex flex-col gap-5" [formRoot]="form">
  <app-input-text
    label="login.email"
    inputId="login-email"
    type="email"
    autocomplete="email"
    inputmode="email"
    placeholder="login.emailPlaceholder"
    [errorMessages]="{ required: 'login.errors.emailRequired', email: 'login.errors.emailInvalid' }"
    [formField]="form.email"
  />

  <app-input-password
    label="login.password"
    inputId="login-password"
    [errorMessages]="{
      required: 'login.errors.passwordRequired',
      minLength: 'login.errors.passwordMinLength',
    }"
    [errorParams]="{ min: passwordMinLength }"
    [formField]="form.password"
  />

  <button appButton type="submit" [rounded]="true" class="mt-2 w-full">
    {{ 'login.submit' | transloco }}
  </button>
</form>
