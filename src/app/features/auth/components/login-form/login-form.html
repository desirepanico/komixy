<form class="flex flex-col gap-5" [formRoot]="form">
  <app-input-text
    label="login.email"
    inputId="login-email"
    type="email"
    autocomplete="email"
    placeholder="login.emailPlaceholder"
    [formField]="form.email"
  />

  <app-input-password
    label="login.password"
    inputId="login-password"
    placeholder="login.passwordPlaceholder"
    [formField]="form.password"
  />

  <button
    appButton
    type="button"
    variant="text"
    class="-mt-2 self-end px-1 text-sm text-primary-300 underline-offset-4 hover:underline"
    (click)="forgotPassword.emit()"
  >
    {{ 'login.forgotPassword' | transloco }}
  </button>

  <button appButton type="submit" [rounded]="true" class="mt-2 w-full">
    {{ 'login.submit' | transloco }}
  </button>
</form>

<div class="my-6 flex items-center gap-3 text-sm text-surface-400" role="separator">
  <span class="h-px flex-1 bg-surface-700"></span>
  {{ 'login.or' | transloco }}
  <span class="h-px flex-1 bg-surface-700"></span>
</div>

<div class="flex flex-col gap-3 sm:flex-row">
  @for (provider of socialProviders; track provider) {
    <button
      appButton
      type="button"
      variant="outlined"
      [rounded]="true"
      class="w-full"
      (click)="socialLogin.emit(provider)"
    >
      {{ 'login.' + provider | transloco }}
    </button>
  }
</div>

<div class="mt-3 hidden lg:block">
  <button
    appButton
    type="button"
    variant="text"
    [rounded]="true"
    class="w-full"
    (click)="guestAccess.emit()"
  >
    {{ 'login.guest' | transloco }}
  </button>
  <p class="mt-1 text-center text-xs text-surface-400">{{ 'login.guestHint' | transloco }}</p>
</div>

<p class="mt-6 text-center text-sm text-surface-300">
  {{ 'login.noAccount' | transloco }}
  <button
    appButton
    type="button"
    variant="text"
    class="px-1 font-semibold text-primary-300 underline-offset-4 hover:underline"
    (click)="registerClick.emit()"
  >
    {{ 'login.register' | transloco }}
  </button>
</p>
