<!-- Bagliori dietro ai volumi -->
<div class="pointer-events-none absolute inset-0" aria-hidden="true">
  <div
    class="absolute -left-16 top-1/4 size-56 animate-orb rounded-full bg-primary-600/30 blur-3xl motion-reduce:animate-none"
  ></div>
  <div
    class="absolute -right-10 bottom-8 size-48 animate-orb rounded-full bg-primary-400/20 blur-3xl [animation-delay:-4s] motion-reduce:animate-none"
  ></div>
</div>

<div
  class="relative flex h-full flex-col justify-center max-lg:contents lg:gap-[3dvh] lg:px-12 lg:py-[6dvh] xl:px-20"
>
  <div
    class="flex animate-fade-up items-center justify-center gap-3 motion-reduce:animate-none lg:justify-start"
  >
    <span
      class="flex size-10 items-center justify-center rounded-xl bg-primary-500 text-surface-950 shadow-lg shadow-primary-900/20"
      aria-hidden="true"
    >
      <ng-icon name="matMenuBookOutline" size="1.5rem" />
    </span>
    <span class="text-xl font-bold tracking-tight text-surface-50">
      {{ 'loginHero.brand' | transloco }}
    </span>
  </div>

  <div
    class="max-w-xl animate-fade-up space-y-3 text-center lg:text-left [animation-delay:120ms] motion-reduce:animate-none"
  >
    <p
      class="text-xl font-bold leading-tight tracking-tight text-surface-50 sm:text-3xl lg:text-[min(3rem,6dvh)]"
    >
      {{ 'loginHero.title' | transloco }}
    </p>
    <p class="hidden text-base leading-7 text-surface-300 lg:block">
      {{ 'loginHero.subtitle' | transloco }}
    </p>
  </div>

  <p
    class="flex animate-fade-up items-center gap-2 text-sm text-surface-200 [animation-delay:240ms] motion-reduce:animate-none"
  >
    <ng-icon
      name="matTouchAppOutline"
      size="1.25rem"
      class="animate-pulse text-primary-300 motion-reduce:animate-none"
      aria-hidden="true"
    />
    {{ 'loginHero.coversHint' | transloco }}
  </p>

  <ul
    class="flex h-[min(12rem,23dvh)] items-end justify-center -space-x-6 sm:h-[min(18rem,28dvh)] sm:-space-x-8 lg:h-[min(18rem,32dvh)] lg:justify-start lg:-space-x-3"
  >
    @for (cover of covers; track cover.id) {
      <li
        class="relative aspect-2/3 w-[min(5.5rem,12.5dvh)] animate-float motion-reduce:animate-none sm:w-[min(11rem,17dvh)] lg:w-[min(9rem,15dvh)] hover:z-10 focus-within:z-10 {{
          cover.motion
        }} {{ cover.offset }}"
      >
        <!-- Il bottone gira come una carta: davanti la copertina, dietro titolo, autore e tipo -->
        <button
          type="button"
          class="group block size-full cursor-pointer rounded-lg outline-none perspective-distant hover:-translate-y-2 hover:scale-110 focus-visible:-translate-y-2 focus-visible:scale-110 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary-400 motion-safe:transition motion-safe:duration-300"
          [attr.aria-pressed]="flipped().has(cover.id)"
          (click)="toggle(cover.id)"
        >
          <span
            class="relative block size-full transform-3d motion-safe:transition-transform motion-safe:duration-500"
            [class.rotate-y-180]="flipped().has(cover.id)"
          >
            <span
              class="absolute inset-0 overflow-hidden rounded-lg border border-primary-300/30 shadow-xl shadow-surface-950/60 backface-hidden"
              [attr.aria-hidden]="flipped().has(cover.id)"
            >
              <img
                [ngSrc]="cover.src"
                width="240"
                height="360"
                [alt]="'mangaCard.coverAlt' | transloco: { title: cover.title }"
                draggable="false"
                class="size-full object-cover"
              />
            </span>
            <span
              class="absolute inset-0 flex rotate-y-180 flex-col items-center justify-center gap-1.5 rounded-lg border border-primary-300/40 bg-linear-to-br from-primary-700 to-surface-900 p-2 text-center shadow-xl shadow-primary-900/40 backface-hidden"
              [attr.aria-hidden]="!flipped().has(cover.id)"
            >
              <span class="text-xs font-bold leading-tight text-surface-50 lg:text-sm">
                {{ cover.title }}
              </span>
              <span class="text-[0.65rem] leading-tight text-surface-200 lg:text-xs">
                {{ cover.author }}
              </span>
              <app-tag>{{ 'loginHero.kind.' + cover.kind | transloco }}</app-tag>
            </span>
          </span>
        </button>
      </li>
    }
  </ul>
</div>
