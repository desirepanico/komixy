<main class="flex min-h-dvh items-center justify-center px-6 py-10">
  <section class="flex w-full max-w-md flex-col items-start gap-3" aria-labelledby="register-title">
    <h1 id="register-title" class="text-2xl font-bold text-surface-50">
      {{ 'register.title' | transloco }}
    </h1>
    <p class="text-sm text-surface-400">{{ 'register.comingSoonHint' | transloco }}</p>
    <a
      appButton
      variant="text"
      [underline]="true"
      class="mt-3 -ml-2 px-2"
      [routerLink]="navigation.loginLink"
    >
      {{ 'login.backToLogin' | transloco }}
    </a>
  </section>
</main>
