<div
  role="group"
  class="inline-flex gap-0.5 rounded-full border border-primary-400/40 bg-surface-900/80 p-0.5"
  [attr.aria-label]="'ranking.viewLabel' | transloco"
>
  @for (option of options; track option) {
    <button
      type="button"
      class="cursor-pointer rounded-full px-3 py-1.5 text-[13px] font-bold outline-none transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400"
      [class.bg-primary-600]="view() === option"
      [class.text-surface-50]="view() === option"
      [class.text-primary-300]="view() !== option"
      [attr.aria-pressed]="view() === option"
      (click)="view.set(option)"
    >
      {{ 'ranking.' + option | transloco }}
    </button>
  }
</div>
