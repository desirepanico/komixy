<dialog
  #dialog
  [attr.aria-labelledby]="'discover-filters-title'"
  (click)="onDialogClick($event)"
  (close)="onNativeClose()"
  class="m-0 mt-auto h-auto max-h-[88dvh] w-full max-w-none overflow-hidden rounded-t-3xl border border-surface-600 bg-surface-900 p-0 text-surface-100 backdrop:bg-surface-950/70 open:animate-sheet-up motion-reduce:animate-none md:m-0 md:ml-auto md:h-dvh md:max-h-none md:w-md md:rounded-none md:rounded-l-3xl md:open:animate-drawer-in"
>
  <div class="flex max-h-[88dvh] flex-col md:h-dvh md:max-h-none">
    @if (view() === 'guide') {
      <app-discover-guide
        [filters]="filters()"
        [items]="items()"
        [askAge]="askAge()"
        (filtersChange)="filtersChange.emit($event)"
        (back)="view.set('filters')"
        (done)="close()"
      />
    } @else {
      <header class="flex items-center justify-between gap-3 px-5 pt-5 pb-3">
        <h2 id="discover-filters-title" class="text-lg font-bold text-surface-50">
          {{ 'discover.filters.title' | transloco }}
        </h2>
        <button
          type="button"
          (click)="openGuide()"
          class="ml-auto inline-flex min-h-10 cursor-pointer items-center gap-1.5 rounded-full px-3 text-sm font-extrabold text-primary-300 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400"
        >
          <ng-icon name="matInfoOutline" size="18" aria-hidden="true" />
          {{ 'discover.filters.guide' | transloco }}
        </button>
        <button
          type="button"
          (click)="close()"
          [attr.aria-label]="'discover.filters.close' | transloco"
          class="grid size-10 cursor-pointer place-items-center rounded-full text-surface-300 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400"
        >
          <ng-icon name="matCloseOutline" size="22" aria-hidden="true" />
        </button>
      </header>

      <div class="min-h-0 flex-1 space-y-5 overflow-y-auto px-5 pb-4">
        @for (view of facets(); track view.facet) {
          <section [attr.aria-labelledby]="'discover-group-' + view.facet">
            <h3
              [id]="'discover-group-' + view.facet"
              class="mb-2 text-sm font-extrabold text-surface-50"
            >
              {{ view.titleKey | transloco }}
            </h3>
            <div
              role="group"
              [attr.aria-labelledby]="'discover-group-' + view.facet"
              class="flex flex-wrap gap-2"
            >
              @for (value of view.values; track value) {
                <button
                  type="button"
                  [attr.aria-pressed]="isSelected(view, value)"
                  [disabled]="count(view.facet, value) === 0 && !isSelected(view, value)"
                  (click)="toggle(view, value)"
                  class="inline-flex min-h-10 cursor-pointer items-center gap-2 rounded-full border border-surface-600 bg-surface-800/60 px-4 text-sm font-bold text-surface-100 transition-colors hover:border-primary-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 disabled:cursor-not-allowed disabled:opacity-40 aria-pressed:border-primary-500 aria-pressed:bg-primary-900 aria-pressed:text-white"
                >
                  {{ 'discover.options.' + view.facet + '.' + value | transloco }}
                  <span class="text-xs font-semibold text-surface-300">{{
                    count(view.facet, value)
                  }}</span>
                </button>
              }
            </div>
          </section>
        }

        @if (showAdultOption()) {
          <section>
            <button
              type="button"
              role="switch"
              [attr.aria-checked]="filters().showAdult"
              (click)="toggleAdult()"
              class="flex w-full cursor-pointer items-center gap-3 rounded-2xl border border-pink-300/40 bg-pink-300/10 p-3 text-left focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 aria-checked:border-pink-300 aria-checked:bg-pink-300/20"
            >
              <span
                class="grid size-9 shrink-0 place-items-center rounded-full border border-pink-300 text-sm font-extrabold text-pink-200"
                aria-hidden="true"
                >18+</span
              >
              <span class="min-w-0 flex-1">
                <b class="block text-sm text-surface-50">{{
                  'discover.options.showAdult' | transloco
                }}</b>
                <small class="text-sm text-surface-300">{{
                  'discover.filters.adultHint' | transloco
                }}</small>
              </span>
            </button>
          </section>
        }
      </div>

      <footer class="flex items-center justify-between gap-3 border-t border-surface-700 px-5 py-4">
        <button
          type="button"
          (click)="reset()"
          [disabled]="!hasChoices()"
          class="min-h-10 cursor-pointer text-sm font-bold text-primary-300 underline underline-offset-4 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 disabled:cursor-not-allowed disabled:opacity-40"
        >
          {{ 'discover.filters.reset' | transloco }}
        </button>
        <button
          type="button"
          (click)="close()"
          class="min-h-11 cursor-pointer rounded-full bg-primary-500 px-6 text-sm font-extrabold text-surface-950 hover:bg-primary-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-300"
        >
          {{ 'discover.filters.show' | transloco: { count: resultCount() } }}
        </button>
      </footer>
    }
  </div>
</dialog>
