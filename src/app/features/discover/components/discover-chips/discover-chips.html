@if (chips().length) {
  <ul
    role="group"
    [attr.aria-label]="'discoverFilters.applied' | transloco"
    class="m-0 flex [scrollbar-width:none] list-none gap-2 overflow-x-auto p-0.5 md:flex-wrap md:overflow-visible"
  >
    @for (chip of chips(); track chip.key + chip.value) {
      <li class="shrink-0">
        <button
          type="button"
          class="group inline-flex min-h-9.5 cursor-pointer items-center gap-2 rounded-full border border-surface-700 bg-surface-800/80 py-0 pr-2 pl-3.5 text-sm font-bold whitespace-nowrap text-surface-100 transition-colors hover:border-primary-300 hover:bg-surface-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400"
          [attr.aria-label]="
            'discoverFilters.removeChip'
              | transloco
                : {
                    section:
                      'discoverFilters.sections.' + sectionKey(chip, filters().kind) | transloco,
                    value:
                      labelKey(chip)
                      | transloco: { from: filters().yearFrom, to: filters().yearTo },
                  }
          "
          (click)="remove.emit(chip)"
        >
          @if (icon(chip); as name) {
            <ng-icon [name]="name" size="16" class="text-primary-300" aria-hidden="true" />
          } @else if (chip.key === 'adult') {
            <span
              aria-hidden="true"
              class="rounded-sm bg-pink-300/15 px-1 text-[10px]/4 font-black text-pink-300"
              >18+</span
            >
          }
          <span>{{
            labelKey(chip) | transloco: { from: filters().yearFrom, to: filters().yearTo }
          }}</span>
          <span
            aria-hidden="true"
            class="grid size-5.5 place-items-center rounded-full bg-surface-700 text-surface-400 transition-colors group-hover:bg-primary-300 group-hover:text-surface-950"
          >
            <ng-icon name="matCloseOutline" size="12" />
          </span>
        </button>
      </li>
    }
  </ul>
}
