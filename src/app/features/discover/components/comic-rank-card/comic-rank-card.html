<!-- Posizione in classifica: visiva, letta come "Posizione N" dai lettori di schermo -->
<span [class]="badgeClasses()">
  <span aria-hidden="true" class="flex items-baseline gap-0.5">
    <span class="text-xs font-semibold">#</span>{{ rank() }}
  </span>
  <span class="sr-only">{{ 'weeklyManga.rank' | transloco: { rank: rank() } }}</span>
</span>

<app-comic-card
  [id]="comic().id"
  [title]="comic().title"
  [author]="comic().author"
  [volume]="comic().volume"
  [totalVolumes]="comic().totalVolumes"
  [isSingleVolume]="comic().isSingleVolume"
  [editionType]="comic().editionType"
  [coverUrl]="comic().coverUrl"
  [bookmarked]="bookmarked()"
  (bookmarkToggle)="bookmarkToggle.emit()"
/>
