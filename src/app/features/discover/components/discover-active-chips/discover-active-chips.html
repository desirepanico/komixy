@if (chips().length) {
  <ul
    [attr.aria-label]="'discover.chips.label' | transloco"
    class="flex flex-wrap items-center gap-2"
  >
    @for (chip of chips(); track chip.facet + chip.value) {
      <li>
        <button
          type="button"
          (click)="remove(chip)"
          [attr.aria-label]="
            'discover.chips.remove' | transloco: { name: (chip.labelKey | transloco) }
          "
          class="group inline-flex min-h-9.5 cursor-pointer items-center gap-2 rounded-full border border-surface-700 bg-surface-900 pr-2 pl-3.5 text-sm font-bold whitespace-nowrap text-surface-100 transition-colors hover:border-primary-300 hover:bg-surface-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 motion-reduce:transition-none"
        >
          @if (chip.icon) {
            <ng-icon [name]="chip.icon" size="16" class="text-primary-300" aria-hidden="true" />
          } @else {
            <span
              class="rounded-sm bg-pink-300/15 px-1 text-[10px] font-black text-pink-200"
              aria-hidden="true"
              >18+</span
            >
          }
          {{ chip.labelKey | transloco }}
          <span
            class="grid size-5.5 place-items-center rounded-full bg-surface-700 text-surface-400 transition-colors group-hover:bg-primary-300 group-hover:text-surface-950 motion-reduce:transition-none"
            aria-hidden="true"
          >
            <ng-icon name="matCloseOutline" size="12" />
          </span>
        </button>
      </li>
    }
    <li>
      <button
        type="button"
        (click)="clearAll()"
        class="min-h-9 cursor-pointer px-2 text-sm font-bold text-primary-300 underline underline-offset-4 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400"
      >
        {{ 'discover.chips.clearAll' | transloco }}
      </button>
    </li>
  </ul>
}
