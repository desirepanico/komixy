<svg viewBox="0 0 140 84" class="block size-full" focusable="false">
  <!-- Stelline di fondo: quelle in alto brillano al passaggio -->
  <circle
    cx="14"
    cy="16"
    r="1.6"
    fill="#fff"
    class="group-hover/tile:animate-tile-twinkle group-focus-visible/tile:animate-tile-twinkle motion-reduce:animate-none"
  />
  <circle
    cx="126"
    cy="22"
    r="1.4"
    fill="#fff"
    class="[animation-delay:0.3s] group-hover/tile:animate-tile-twinkle group-focus-visible/tile:animate-tile-twinkle motion-reduce:animate-none"
  />
  <circle cx="120" cy="68" r="1.2" fill="#e7dbff" />
  <circle cx="20" cy="64" r="1.2" fill="#e7dbff" />

  @switch (format()) {
    @case ('oneShot') {
      <g
        class="origin-bottom transition-transform duration-400 ease-[cubic-bezier(0.2,0.9,0.3,1.4)] transform-fill group-hover/tile:-translate-y-0.75 group-hover/tile:scale-108 group-hover/tile:-rotate-7 group-focus-visible/tile:-rotate-7 motion-reduce:transition-none"
      >
        <rect x="47" y="8" width="46" height="68" rx="5" fill="currentColor" />
        <rect x="47" y="8" width="8" height="68" rx="4" fill="#1a1236" opacity=".28" />
        <circle cx="76" cy="31" r="10" fill="#fff" opacity=".92" />
        <ellipse
          cx="76"
          cy="31"
          rx="18"
          ry="4.5"
          fill="none"
          stroke="#fff"
          stroke-width="2"
          opacity=".85"
          transform="rotate(-18 76 31)"
        />
        <rect x="60" y="52" width="26" height="4" rx="2" fill="#fff" opacity=".75" />
        <rect x="60" y="60" width="16" height="3" rx="1.5" fill="#fff" opacity=".5" />
      </g>
    }
    @case ('graphicNovel') {
      <g
        class="origin-bottom transition-transform duration-400 ease-[cubic-bezier(0.2,0.9,0.3,1.4)] transform-fill group-hover/tile:-translate-y-0.75 group-hover/tile:scale-108 group-hover/tile:-rotate-7 group-focus-visible/tile:-rotate-7 motion-reduce:transition-none"
      >
        <rect x="38" y="10" width="64" height="66" rx="5" fill="currentColor" />
        <rect x="38" y="10" width="9" height="66" rx="4" fill="#1a1236" opacity=".28" />
        <path d="M88 10v22l6-5 6 5V10z" fill="#fff" opacity=".9" />
        <path
          d="M62 52l4 9 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z"
          fill="#fff"
          opacity=".85"
          transform="translate(5 -22) scale(.9)"
        />
      </g>
    }
    @case ('omnibus') {
      <g
        class="origin-bottom transition-transform delay-70 duration-400 ease-[cubic-bezier(0.2,0.9,0.3,1.4)] transform-fill group-hover/tile:-translate-y-1.75 group-focus-visible/tile:-translate-y-1.75 motion-reduce:transition-none"
      >
        <rect x="30" y="14" width="80" height="24" rx="5" fill="currentColor" opacity=".7" />
        <rect x="38" y="22" width="40" height="3" rx="1.5" fill="#1a1236" opacity=".4" />
      </g>
      <g
        class="origin-bottom transition-transform duration-400 ease-[cubic-bezier(0.2,0.9,0.3,1.4)] transform-fill group-hover/tile:-translate-y-1.75 group-focus-visible/tile:-translate-y-1.75 motion-reduce:transition-none"
      >
        <rect x="22" y="42" width="96" height="30" rx="5" fill="currentColor" />
        <rect x="22" y="52" width="96" height="6" fill="#1a1236" opacity=".25" />
        <text x="70" y="66" text-anchor="middle" font-size="11" font-weight="800" fill="#1a1236">
          1 · 2 · 3
        </text>
      </g>
    }
    @default {
      <!-- Serie: quattro volumi che crescono, ognuno parte un po' dopo il precedente -->
      <g
        class="origin-bottom transition-transform duration-400 ease-[cubic-bezier(0.2,0.9,0.3,1.4)] transform-fill group-hover/tile:-translate-y-1.75 group-focus-visible/tile:-translate-y-1.75 motion-reduce:transition-none"
      >
        <rect x="22" y="40" width="20" height="38" rx="4" fill="currentColor" opacity=".55" />
        <rect x="25" y="46" width="14" height="3" rx="1.5" fill="#1a1236" opacity=".35" />
        <text x="32" y="65" text-anchor="middle" font-size="14" font-weight="800" fill="#1a1236">
          1
        </text>
      </g>
      <g
        class="origin-bottom transition-transform delay-70 duration-400 ease-[cubic-bezier(0.2,0.9,0.3,1.4)] transform-fill group-hover/tile:-translate-y-1.75 group-focus-visible/tile:-translate-y-1.75 motion-reduce:transition-none"
      >
        <rect x="46" y="30" width="20" height="48" rx="4" fill="currentColor" opacity=".7" />
        <rect x="49" y="36" width="14" height="3" rx="1.5" fill="#1a1236" opacity=".35" />
        <text x="56" y="60" text-anchor="middle" font-size="14" font-weight="800" fill="#1a1236">
          2
        </text>
      </g>
      <g
        class="origin-bottom transition-transform delay-140 duration-400 ease-[cubic-bezier(0.2,0.9,0.3,1.4)] transform-fill group-hover/tile:-translate-y-1.75 group-focus-visible/tile:-translate-y-1.75 motion-reduce:transition-none"
      >
        <rect x="70" y="20" width="20" height="58" rx="4" fill="currentColor" opacity=".85" />
        <rect x="73" y="26" width="14" height="3" rx="1.5" fill="#1a1236" opacity=".35" />
        <text x="80" y="55" text-anchor="middle" font-size="14" font-weight="800" fill="#1a1236">
          3
        </text>
      </g>
      <g
        class="origin-bottom transition-transform delay-210 duration-400 ease-[cubic-bezier(0.2,0.9,0.3,1.4)] transform-fill group-hover/tile:-translate-y-1.75 group-focus-visible/tile:-translate-y-1.75 motion-reduce:transition-none"
      >
        <rect x="94" y="10" width="20" height="68" rx="4" fill="currentColor" />
        <rect x="97" y="16" width="14" height="3" rx="1.5" fill="#1a1236" opacity=".35" />
        <text x="104" y="50" text-anchor="middle" font-size="14" font-weight="800" fill="#1a1236">
          …
        </text>
      </g>
    }
  }
</svg>
