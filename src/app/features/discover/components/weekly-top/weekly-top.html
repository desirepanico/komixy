<section
  class="flex flex-col gap-3 rounded-2xl border border-primary-400/20 bg-surface-900 p-4"
  aria-labelledby="weekly-top-title"
>
  <h2 id="weekly-top-title" class="text-sm font-bold text-surface-50">
    {{ 'weeklyPack.topTitle' | transloco }}
  </h2>

  <ul #list class="flex list-none justify-between" [style.gap.px]="gap">
    @for (item of visible(); track item.entry.comic.id) {
      <li>
        <a
          class="block rounded-xl outline-none hover:-translate-y-1 focus-visible:-translate-y-1 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 motion-safe:transition-transform motion-safe:duration-200"
          [routerLink]="item.link"
          [attr.title]="item.entry.comic.title"
          [attr.aria-label]="
            'weeklyPack.cardLabel'
              | transloco: { rank: item.entry.rank, title: item.entry.comic.title }
          "
        >
          <app-pack-card [entry]="item.entry" [scale]="cardScale" [decorative]="true" />
        </a>
      </li>
    }
  </ul>
</section>
