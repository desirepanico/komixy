<div class="min-w-0">
  <h2 class="flex items-center gap-2.5 text-lg font-bold text-surface-50 sm:text-xl">
    {{ title() }}
    @if (count() !== null) {
      <span
        class="rounded-full bg-primary-500/20 px-2.5 py-0.5 text-xs font-extrabold text-primary-200 tabular-nums"
        >{{ 'discover.rows.count' | transloco: { count: count() } }}</span
      >
    }
  </h2>
  @if (subtitle()) {
    <p class="text-sm text-surface-400">{{ subtitle() }}</p>
  }
</div>

<div class="mt-5">
  @if (grid()) {
    <ul
      class="grid grid-cols-2 gap-x-3 gap-y-4 sm:grid-cols-[repeat(auto-fill,minmax(9.75rem,1fr))]"
      [attr.aria-label]="title()"
    >
      @for (comic of items(); track comic.id) {
        <li
          class="animate-[discover-row-card-in_350ms_cubic-bezier(0.2,0.8,0.2,1)_both] motion-reduce:animate-none"
          [style.animation-delay.ms]="$index * 28"
        >
          <app-comic-card [comic]="comic" [link]="comicsNavigation.detailLink(comic.id)">
            <app-bookmark-button cardAction [comicId]="comic.id" />
          </app-comic-card>
        </li>
      }
    </ul>
  } @else {
    <app-horizontal-scroller [ariaLabel]="title()">
      @for (comic of items(); track comic.id) {
        <div class="w-40 shrink-0 snap-start lg:w-44">
          <app-comic-card [comic]="comic" [link]="comicsNavigation.detailLink(comic.id)">
            <app-bookmark-button cardAction [comicId]="comic.id" />
          </app-comic-card>
        </div>
      }
    </app-horizontal-scroller>
  }
</div>
