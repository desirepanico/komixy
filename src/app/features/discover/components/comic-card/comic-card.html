<!-- Card cliccabile: il link è sul titolo e il suo ::after copre tutta la card (raggiungibile con Tab, Invio apre) -->
<div
  class="group relative flex h-full min-w-0 cursor-pointer flex-col gap-1 overflow-hidden rounded-xl border border-primary-400/20 bg-surface-900 p-2 shadow-lg shadow-surface-950/50 outline-none transition duration-200 hover:border-primary-400/50 has-[a:focus-visible]:border-primary-400/50 has-[a:focus-visible]:ring-2 has-[a:focus-visible]:ring-primary-400 has-[a:focus-visible]:ring-offset-2 has-[a:focus-visible]:ring-offset-surface-950 active:scale-[0.98]"
>
  <div class="relative w-full shrink-0 overflow-hidden rounded-xl">
    <img
      class="block h-40 w-full aspect-2/3 object-cover transition-transform duration-300 group-hover:scale-[1.03]"
      [src]="coverUrl()"
      loading="lazy"
      [alt]="'mangaCard.coverAlt' | transloco: { title: title() }"
    />

    <button
      appBookmarkButton
      type="button"
      class="absolute right-2 top-2 z-10"
      [bookmarked]="bookmarked()"
      (click)="handleBookmarkClick($event)"
    ></button>

    @if (editionType()) {
      <div
        class="absolute inset-x-0 bottom-0 bg-linear-to-t from-surface-950/95 via-surface-950/75 to-transparent px-2 pb-3 pt-8"
      >
        <app-tag [severity]="editionSeverity()">
          {{ 'mangaCard.editions.' + editionType() | transloco }}
        </app-tag>
      </div>
    }
  </div>

  <div class="flex min-w-0 flex-1 flex-col gap-1.5 px-2 pb-2 pt-1">
    <h3
      class="truncate text-sm font-bold leading-5 text-surface-50 transition-colors group-hover:text-primary-300"
      [title]="title()"
    >
      <a
        [routerLink]="[AppRoutes.Comic, id()]"
        class="outline-none after:absolute after:inset-0 after:rounded-xl"
      >
        {{ title() }}
      </a>
    </h3>
    <p class="truncate text-xs leading-4 text-surface-400" [title]="author()">
      {{ author() }}
    </p>
    @if (isSingleVolume()) {
      <span class="truncate text-xs font-semibold text-primary-400">
        {{ 'mangaCard.singleVolume' | transloco }}
      </span>
    } @else {
      <div class="flex items-center gap-1">
        <span class="text-xs text-primary-400">{{ 'mangaCard.volumeLabel' | transloco }}</span>

        <span class="text-sm font-bold leading-1.5 text-primary-300">
          {{ volume() }}
        </span>

        @if (totalVolumes()) {
          <span class="truncate text-xs text-surface-400"> / {{ totalVolumes() }} </span>
        }
      </div>
    }
  </div>
</div>
