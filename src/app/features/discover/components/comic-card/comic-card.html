<div
  [routerLink]="[AppRoutes().Comic, id()]"
  class="group block rounded-3xl border border-primary-400/20 bg-surface-900/75 p-3 outline-none transition duration-200 glass-strong hover:border-primary-400/50 hover:bg-surface-800/80 focus-visible:ring-2 focus-visible:ring-primary-400 focus-visible:ring-offset-2 focus-visible:ring-offset-surface-950 active:scale-[0.99] md:p-4"
>
  <div class="flex gap-4">
    <img
      class="shrink-0 rounded-lg object-cover h-30 w-20"
      [src]="coverUrl()"
      loading="lazy"
      [alt]="'mangaCard.coverAlt' | transloco: { title: title() }"
    />

    <div class="flex min-w-0 flex-1 flex-col gap-2 justify-between">
      <div class="flex flex-col justify-between">
        <div class="flex flex-col gap-2">
          <div class="flex min-w-0 items-start gap-2">
            <div class="flex min-w-0 flex-1 flex-col gap-1">
              <h3
                class="line-clamp-2 wrap-break-word text-base font-bold leading-snug text-surface-50 transition-colors group-hover:text-primary-300 sm:text-lg"
              >
                {{ title() }}
              </h3>
              <div class="flex items-center gap-2">
                <span class="min-w-0 truncate text-sm text-surface-400">
                  {{ author() }}
                </span>

                <span class="shrink-0 text-sm font-semibold text-primary-400">
                  {{ 'mangaCard.volume' | transloco: { volume: volume() } }}
                </span>
              </div>
            </div>

            <button
              type="button"
              class="relative z-10 flex size-11 shrink-0 touch-manipulation items-center justify-center rounded-full border"
              [class.border-primary-500]="bookmarked()"
              [class.bg-primary-900]="bookmarked()"
              [class.border-surface-700/70]="!bookmarked()"
              [class.bg-surface-800/60]="!bookmarked()"
              [class.text-primary-400]="true"
              [attr.aria-label]="
                (bookmarked() ? 'mangaCard.removeBookmark' : 'mangaCard.addBookmark') | transloco
              "
              [attr.aria-pressed]="bookmarked()"
              (click)="handleBookmarkClick($event)"
            >
              <ng-icon name="matBookmarkOutline" size="24" class="transition-colors duration-200" />
            </button>
          </div>
          <p class="line-clamp-2 wrap-break-word text-xs leading-relaxed text-surface-500">
            {{ description() }}
          </p>
        </div>
      </div>

      <div class="hidden min-w-0 flex-wrap items-center gap-1.5 sm:flex">
        @for (genre of genre(); track genre) {
          <span
            class="w-fit rounded-full border border-primary-500/40 bg-primary-500/10 px-2.5 py-1 text-xs font-medium uppercase tracking-wide text-primary-300"
          >
            {{ genre }}
          </span>
        }
      </div>
    </div>
  </div>
</div>
