<div
  [routerLink]="[AppRoutes().Comic, id()]"
  class="group block rounded-3xl border cursor-pointer border-primary-400/20 bg-surface-900/75 p-3.5 outline-none transition duration-200 glass-strong hover:border-primary-400/50 hover:bg-surface-800/80 focus-visible:ring-2 focus-visible:ring-primary-400 focus-visible:ring-offset-2 focus-visible:ring-offset-surface-950 active:scale-[0.99]"
>
  <div class="flex items-start gap-3.5">
    <!-- Copertina con altezza/larghezza fisse e ben proporzionate -->
    <img
      class="shrink-0 rounded-xl object-cover h-28 w-20 shadow-md"
      [src]="coverUrl()"
      loading="lazy"
      [alt]="'mangaCard.coverAlt' | transloco: { title: title() }"
    />

    <!-- Blocco informazioni: compatto e senza spazii forzati -->
    <div class="flex min-w-0 flex-1 flex-col justify-between h-28 py-0.5">
      <!-- Parte Superiore: Titolo + Bookmark -->
      <div>
        <div class="flex items-start justify-between gap-2">
          <h3
            class="line-clamp-2 wrap-break-word text-sm font-bold leading-tight text-surface-50 transition-colors group-hover:text-primary-300 sm:text-base"
          >
            {{ title() }}
          </h3>

          <!-- Bookmark -->
          <button
            type="button"
            class="relative z-10 -mr-1 -mt-1 flex size-8 shrink-0 touch-manipulation items-center justify-center rounded-full border cursor-pointer transition-colors hover:border-primary-500"
            [class.border-primary-500]="bookmarked()"
            [class.bg-primary-900/80]="bookmarked()"
            [class.border-surface-700/70]="!bookmarked()"
            [class.bg-surface-800/60]="!bookmarked()"
            [class.text-primary-300]="true"
            [attr.aria-label]="
              (bookmarked() ? 'mangaCard.removeBookmark' : 'mangaCard.addBookmark') | transloco
            "
            [attr.aria-pressed]="bookmarked()"
            (click)="handleBookmarkClick($event)"
          >
            <ng-icon name="matBookmarkOutline" size="18" class="transition-colors duration-200" />
          </button>
        </div>

        <!-- Autore -->
        <p class="min-w-0 truncate text-xs text-surface-400 mt-0.5">
          {{ author() }}
        </p>
      </div>

      <!-- Parte Inferiore: Volume + Tag (Sempre ancorati in basso) -->
      <div class="flex flex-wrap items-center justify-between gap-1.5 mt-auto pt-1">
        <!-- Info Volume -->
        <div class="flex items-baseline gap-1">
          @if (isSingleVolume()) {
            <span class="text-xs font-semibold text-primary-400">
              {{ 'mangaCard.singleVolume' | transloco }}
            </span>
          } @else {
            <span class="text-xs text-primary-400">Vol.</span>
            <span class="text-sm font-bold text-primary-400">{{ volume() }}</span>
            @if (totalVolumes()) {
              <span class="text-xs font-normal text-primary-400">/ {{ totalVolumes() }}</span>
            }
          }
        </div>

        <!-- Tag Edizione (affiancato o subito sotto, senza "salti") -->
        @if (editionType()) {
          <p-tag
            [value]="'mangaCard.editions.' + editionType() | transloco"
            [severity]="editionSeverity()"
            [rounded]="true"
          />
        }
      </div>
    </div>
  </div>
</div>
