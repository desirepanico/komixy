<div
  [tabIndex]="0"
  [routerLink]="[AppRoutes().Comic, id()]"
  class="group flex h-full min-w-0 cursor-pointer flex-col gap-1 overflow-hidden rounded-3xl border border-primary-400/20 bg-surface-900/75 p-2 outline-none transition duration-200 glass-strong hover:border-primary-400/50 focus-visible:border-primary-400/50 focus-visible:ring-2 focus-visible:ring-primary-400 focus-visible:ring-offset-2 focus-visible:ring-offset-surface-950 active:scale-[0.98]"
>
  <!-- Copertina verticale -->
  <div class="relative w-full shrink-0 overflow-hidden rounded-2xl">
    <img
      class="block h-40 w-full aspect-2/3 object-cover transition-transform duration-300 group-hover:scale-[1.03]"
      [src]="coverUrl()"
      loading="lazy"
      [alt]="'mangaCard.coverAlt' | transloco: { title: title() }"
    />

    <!-- Bookmark -->
    <button
      type="button"
      class="absolute right-2 top-2 z-10 flex size-9 cursor-pointer items-center justify-center rounded-full border backdrop-blur-md transition-all outline-hidden focus-visible:border-primary-400 focus-visible:ring-2 focus-visible:ring-primary-400"
      [class.border-primary-400]="bookmarked()"
      [class.bg-primary-900/90]="bookmarked()"
      [class.border-white/20]="!bookmarked()"
      [class.bg-surface-950/75]="!bookmarked()"
      [class.text-primary-300]="true"
      [attr.aria-label]="
        (bookmarked() ? 'mangaCard.removeBookmark' : 'mangaCard.addBookmark') | transloco
      "
      [attr.aria-pressed]="bookmarked()"
      (click)="handleBookmarkClick($event)"
    >
      <ng-icon name="matBookmarkOutline" size="18" />
    </button>

    <!-- Tag edizione sulla copertina (ripulito dal doppio @if) -->
    @if (editionType()) {
      <div
        class="absolute inset-x-0 bottom-0 bg-linear-to-t from-black/95 via-black/75 to-transparent px-2 pb-3 pt-8"
      >
        <p-tag
          [value]="'mangaCard.editions.' + editionType() | transloco"
          [severity]="editionSeverity()"
          [rounded]="true"
        />
      </div>
    }
  </div>

  <!-- Informazioni compatte in colonna -->
  <div class="flex min-w-0 flex-1 flex-col gap-1 px-1">
    <!-- Titolo -->
    <h3
      class="truncate text-sm font-bold leading-5 text-surface-50 transition-colors group-hover:text-primary-300"
      [title]="title()"
    >
      {{ title() }}
    </h3>
    <!-- Autore -->
    <p class="truncate text-xs leading-4 text-surface-400" [title]="author()">
      {{ author() }}
    </p>
    @if (isSingleVolume()) {
      <span class="truncate text-xs font-semibold text-primary-400">
        {{ 'mangaCard.singleVolume' | transloco }}
      </span>
    } @else {
      <!-- Volume -->
      <div class="flex items-center gap-1">
        <span class="text-xs text-primary-400">Vol.</span>

        <span class="text-sm font-bold leading-1.5 text-primary-300">
          {{ volume() }}
        </span>

        @if (totalVolumes()) {
          <span class="truncate text-xs text-surface-400"> / {{ totalVolumes() }} </span>
        }
      </div>
    }
  </div>
</div>
