<button
  type="button"
  aria-haspopup="dialog"
  [attr.aria-expanded]="expanded()"
  [attr.aria-label]="'discover.filters.open' | transloco: { count: count() }"
  (click)="pressed.emit()"
  class="relative inline-flex cursor-pointer items-center justify-center gap-2 rounded-full border text-sm font-bold text-surface-200 transition-[border-color,background-color] duration-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 motion-reduce:transition-none max-sm:px-3.5"
  [class]="
    compact()
      ? 'h-10 border-primary-400/30 bg-white/6 px-3 hover:border-primary-400/50 aria-expanded:border-primary-400 aria-expanded:bg-primary-900'
      : 'h-11 border-primary-400/22 bg-surface-900/45 px-4 shadow-[0_6px_24px_rgb(14_16_23/0.4),inset_0_1px_0_rgb(250_250_252/0.06)] backdrop-blur-[14px] backdrop-saturate-130 hover:border-primary-400/50 hover:bg-surface-900/70 aria-expanded:border-primary-500 aria-expanded:bg-primary-900'
  "
>
  <ng-icon name="matTuneOutline" size="18" class="text-primary-300" aria-hidden="true" />
  <span class="max-sm:sr-only" [class.sr-only]="compact()" aria-hidden="true">{{
    'discover.filters.title' | transloco
  }}</span>
  @if (count() > 0) {
    <span
      class="grid h-5 min-w-5 place-items-center rounded-full bg-primary-500 px-1.5 text-xs font-extrabold text-white max-sm:absolute max-sm:-top-1.5 max-sm:-right-1"
      [class.absolute]="compact()"
      [class.-top-1.5]="compact()"
      [class.-right-1]="compact()"
      aria-hidden="true"
    >
      {{ count() }}
    </span>
  }
</button>
