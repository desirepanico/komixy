<button
  type="button"
  aria-haspopup="dialog"
  [attr.aria-expanded]="expanded()"
  [attr.aria-label]="'discover.filters.open' | transloco: { count: count() }"
  (click)="pressed.emit()"
  class="relative inline-flex h-11 cursor-pointer items-center justify-center gap-2 rounded-full border border-surface-600 bg-surface-900/70 px-4 text-sm font-bold text-surface-100 transition-colors hover:border-primary-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 aria-expanded:border-primary-400 aria-expanded:bg-primary-900 max-sm:px-3"
  [class.h-10]="compact()"
  [class.px-3]="compact()"
>
  <ng-icon name="matTuneOutline" size="20" class="text-primary-300" aria-hidden="true" />
  <span class="max-sm:sr-only" [class.sr-only]="compact()" aria-hidden="true">{{
    'discover.filters.title' | transloco
  }}</span>
  @if (count() > 0) {
    <span
      class="grid h-5 min-w-5 place-items-center rounded-full bg-primary-500 px-1.5 text-xs font-extrabold text-white max-sm:absolute max-sm:-top-1.5 max-sm:-right-1"
      [class.absolute]="compact()"
      [class.-top-1.5]="compact()"
      [class.-right-1]="compact()"
      aria-hidden="true"
    >
      {{ count() }}
    </span>
  }
</button>
