@if (compact()) {
  <div
    role="group"
    [attr.aria-label]="'discover.tabs.label' | transloco"
    class="flex shrink-0 gap-0.5 rounded-full bg-surface-950/40 p-1"
  >
    @for (tab of tabs(); track tab.kind) {
      <button
        type="button"
        [attr.aria-pressed]="kind() === tab.kind"
        (click)="kind.set(tab.kind)"
        class="inline-flex min-h-9 cursor-pointer items-center gap-2 rounded-full px-3 text-sm font-extrabold transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 aria-pressed:bg-primary-600 aria-pressed:text-white [&:not([aria-pressed=true])]:text-surface-300 [&:not([aria-pressed=true])]:hover:text-white"
      >
        <img
          [src]="tab.covers[0]"
          alt=""
          width="24"
          height="24"
          class="hidden size-6 rounded-full object-cover sm:block"
        />
        {{ 'discover.tabs.' + tab.kind | transloco }}
      </button>
    }
  </div>
} @else {
  <div
    role="group"
    [attr.aria-label]="'discover.tabs.label' | transloco"
    class="flex flex-wrap gap-3"
  >
    @for (tab of tabs(); track tab.kind) {
      <button
        type="button"
        [attr.aria-pressed]="kind() === tab.kind"
        (click)="kind.set(tab.kind)"
        class="group flex min-h-16 min-w-0 flex-1 cursor-pointer items-center gap-3 rounded-2xl border border-surface-700 bg-surface-900/50 p-3 text-left transition-colors hover:border-primary-400/60 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 aria-pressed:border-primary-300/60 aria-pressed:bg-linear-to-br aria-pressed:from-primary-900/70 aria-pressed:to-surface-800/70 sm:max-w-64"
      >
        <span class="relative block h-12 w-14 shrink-0" aria-hidden="true">
          @for (cover of tab.covers; track $index) {
            <img
              [src]="cover"
              alt=""
              width="32"
              height="44"
              class="absolute bottom-0 h-11 w-8 rounded-md border border-surface-50/30 object-cover shadow-md transition-transform group-aria-pressed:-translate-y-1"
              [class]="
                $index === 0
                  ? 'left-0 -rotate-6'
                  : $index === 1
                    ? 'left-3'
                    : 'left-6 rotate-6 group-aria-pressed:translate-x-1'
              "
            />
          }
        </span>
        <span class="min-w-0">
          <b class="block text-lg/tight text-surface-50">
            {{ 'discover.tabs.' + tab.kind | transloco }}
          </b>
          <small class="text-sm text-surface-400">
            {{ 'discover.tabs.count' | transloco: { count: tab.count } }}
          </small>
        </span>
      </button>
    }
  </div>
}
