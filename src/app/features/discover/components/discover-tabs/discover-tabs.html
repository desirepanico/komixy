@if (compact()) {
  <div
    role="group"
    [attr.aria-label]="'discover.tabs.label' | transloco"
    class="flex shrink-0 gap-0.5 rounded-full bg-surface-950/40 p-1"
  >
    @for (tab of tabs(); track tab.kind) {
      <button
        type="button"
        [attr.aria-pressed]="kind() === tab.kind"
        (click)="kind.set(tab.kind)"
        class="inline-flex min-h-9 cursor-pointer items-center gap-2 rounded-full px-3 text-sm font-extrabold transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 aria-pressed:bg-primary-600 aria-pressed:text-white [&:not([aria-pressed=true])]:text-surface-300 [&:not([aria-pressed=true])]:hover:text-white"
      >
        <img
          [src]="tab.covers[0]"
          alt=""
          width="24"
          height="24"
          class="hidden size-6 rounded-full object-cover sm:block"
        />
        {{ 'discover.tabs.' + tab.kind | transloco }}
      </button>
    }
  </div>
} @else {
  <div
    role="group"
    [attr.aria-label]="'discover.tabs.label' | transloco"
    class="flex flex-wrap gap-3"
  >
    @for (tab of tabs(); track tab.kind) {
      <button
        type="button"
        [attr.aria-pressed]="kind() === tab.kind"
        (click)="kind.set(tab.kind)"
        class="group flex min-h-16 min-w-0 flex-1 cursor-pointer items-center gap-3 rounded-2xl border border-surface-700 bg-surface-900/50 p-3 text-left transition-colors hover:border-primary-400/60 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 aria-pressed:-translate-y-0.5 aria-pressed:border-primary-300/60 aria-pressed:bg-linear-to-br aria-pressed:from-primary-900/70 aria-pressed:to-surface-800/70 aria-pressed:shadow-[0_12px_30px_-12px] aria-pressed:shadow-primary-500/70 motion-reduce:transition-none sm:max-w-64"
      >
        <span class="relative ml-1.5 block h-11.5 w-15 shrink-0 sm:h-14 sm:w-19" aria-hidden="true">
          @for (cover of tab.covers; track $index) {
            <img
              [src]="cover"
              alt=""
              width="34"
              height="46"
              class="absolute bottom-0 h-9.5 w-7 rounded-[7px] border border-surface-50/30 object-cover shadow-md brightness-80 saturate-70 transition-[translate,rotate,filter] duration-400 ease-[cubic-bezier(0.2,0.9,0.3,1.3)] group-hover:brightness-100 group-hover:saturate-100 group-aria-pressed:brightness-100 group-aria-pressed:saturate-100 motion-reduce:transition-none sm:h-11.5 sm:w-8.5"
              [class]="
                $index === 0
                  ? 'left-0 origin-bottom -rotate-10 group-hover:-translate-x-1.25 group-hover:-rotate-18 group-aria-pressed:-translate-x-1.25 group-aria-pressed:-rotate-18'
                  : $index === 1
                    ? 'left-3 -translate-y-1 group-hover:-translate-y-2 group-aria-pressed:-translate-y-2 sm:left-3.75'
                    : 'left-6 origin-bottom rotate-10 group-hover:translate-x-1.25 group-hover:rotate-18 group-aria-pressed:translate-x-1.25 group-aria-pressed:rotate-18 sm:left-7.5'
              "
            />
          }
        </span>
        <span class="min-w-0">
          <b
            class="block text-base/tight font-black text-surface-500 group-hover:text-surface-100 group-aria-pressed:text-white"
          >
            {{ 'discover.tabs.' + tab.kind | transloco }}
          </b>
          <small class="text-xs font-bold text-surface-400 group-aria-pressed:text-primary-200">
            {{ 'discover.tabs.count' | transloco: { count: tab.count } }}
          </small>
        </span>
      </button>
    }
  </div>
}
