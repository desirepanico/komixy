<section class="min-w-0 space-y-8 px-3 py-2 md:p-2">
  <div class="space-y-4">
    <div class="min-w-0">
      <h1 class="text-lg font-bold text-surface-50 sm:text-xl">
        {{ 'weeklyManga.title' | transloco }}
      </h1>
      <p class="text-sm text-surface-400">
        {{ 'weeklyManga.subtitle' | transloco }}
      </p>
    </div>

    <!-- Il contenitore decide la disposizione: il pannello Top compare solo se sta accanto alla striscia (da 59rem); sotto resta la sola striscia, a tutta larghezza -->
    <div class="@container">
      <div class="flex flex-col gap-4 @min-[59rem]:flex-row @min-[59rem]:items-start">
        <app-weekly-pack-banner
          [class]="
            pack.isOpened()
              ? 'min-w-0 flex-1 @min-[59rem]:max-w-3xl @min-[59rem]:min-w-lg'
              : 'min-w-0 flex-1'
          "
        />
        @if (pack.isOpened()) {
          <app-weekly-top
            class="hidden @min-[59rem]:block @min-[59rem]:min-w-104 @min-[59rem]:flex-1"
          />
        }
      </div>
    </div>
  </div>

  <div class="space-y-4">
    <div class="min-w-0">
      <h2 class="text-lg font-bold text-surface-50 sm:text-xl">
        {{ 'discoverManga.title' | transloco }}
      </h2>
      <p class="text-sm text-surface-400">
        {{ 'discoverManga.subtitle' | transloco }}
      </p>
    </div>

    <app-horizontal-scroller [ariaLabel]="'discoverManga.title' | transloco">
      @for (comic of catalog.toDiscover(); track comic.id) {
        <div class="w-40 shrink-0 snap-start lg:w-44">
          <app-comic-card
            [id]="comic.id"
            [title]="comic.title"
            [author]="comic.author"
            [volume]="comic.volume"
            [totalVolumes]="comic.totalVolumes"
            [isSingleVolume]="comic.isSingleVolume"
            [editionType]="comic.editionType"
            [coverUrl]="comic.coverUrl"
          />
        </div>
      }
    </app-horizontal-scroller>
  </div>
</section>
