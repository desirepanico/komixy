<ul
  class="relative mx-auto w-full list-none"
  [style.height.px]="height()"
  [style.max-width.px]="width()"
>
  @for (item of fan(); track item.entry.comic.id; let i = $index) {
    <li
      class="absolute left-1/2 motion-safe:transition-transform motion-safe:duration-700 motion-safe:ease-out"
      style="transform-origin: 50% 158%"
      [style.top.px]="top()"
      [style.margin-left.px]="-cardHalfWidth()"
      [style.transform]="'rotate(' + (spread() ? item.angle : 0) + 'deg)'"
      [style.transition-delay.ms]="i * 30"
      [style.z-index]="item.layer"
    >
      <button
        type="button"
        [style.border-radius]="cardRadius()"
        class="block cursor-pointer hover:-translate-y-3 focus-visible:-translate-y-3 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 motion-safe:transition-transform motion-safe:duration-200"
        [attr.aria-label]="
          'weeklyPack.cardLabel'
            | transloco: { rank: item.entry.rank, title: item.entry.comic.title }
        "
        (click)="cardSelect.emit(item.entry)"
      >
        <app-pack-card
          [entry]="item.entry"
          [scale]="cardScale()"
          [compact]="true"
          [decorative]="true"
        />
      </button>
    </li>
  }
</ul>
