@if (bookmarks.canSave()) {
  <button
    appToggleButton
    type="button"
    [pressed]="saved()"
    [attr.aria-label]="(saved() ? 'bookmark.remove' : 'bookmark.add') | transloco"
    (click)="bookmarks.toggle(comicId())"
  >
    <ng-icon name="matBookmarkOutline" size="18" />
  </button>
} @else {
  <a
    [routerLink]="session.signUpLink"
    class="inline-flex size-9 shrink-0 items-center justify-center rounded-full border border-dashed border-primary-300 bg-surface-950/80 text-primary-300 transition-colors hover:border-primary-200 hover:bg-surface-800 hover:text-primary-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400"
    [attr.aria-label]="'bookmark.signUp' | transloco"
  >
    <ng-icon name="matLockOutline" size="18" />
  </a>
}
