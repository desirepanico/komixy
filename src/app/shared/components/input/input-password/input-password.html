<app-field-wrapper
  [label]="label()"
  [inputId]="inputId()"
  [errors]="showError() ? field()().errors() : []"
>
  <div class="relative">
    <input
      [id]="inputId()"
      [type]="visible() ? 'text' : 'password'"
      [formField]="field()"
      [placeholder]="placeholder() | transloco"
      [attr.autocomplete]="autocomplete() || null"
      [attr.aria-invalid]="showError()"
      [attr.aria-describedby]="showError() ? inputId() + '-error' : null"
      class="w-full rounded-xl border border-surface-700 bg-surface-950/60 py-2.5 pl-4 pr-14 text-sm text-surface-50 placeholder:text-surface-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 aria-invalid:border-red-400"
    />
    <!-- L'etichetta non cambia: lo stato lo annuncia aria-pressed -->
    <button
      appButton
      type="button"
      variant="text"
      severity="secondary"
      [iconOnly]="true"
      class="absolute right-1.5 top-1/2 size-8! -translate-y-1/2 rounded-lg! focus-visible:outline-offset-0!"
      [attr.aria-pressed]="visible()"
      [attr.aria-label]="'inputPassword.show' | transloco"
      (click)="toggleVisible()"
    >
      <ng-icon [name]="visible() ? 'matVisibilityOffOutline' : 'matVisibilityOutline'" size="20" />
    </button>
  </div>
</app-field-wrapper>
