<app-input-text
  [(value)]="value"
  [inputId]="inputId()"
  [type]="visible() ? 'text' : 'password'"
  [placeholder]="placeholder()"
  [autocomplete]="autocomplete()"
  [disabled]="disabled()"
  [invalid]="invalid()"
  [touched]="touched()"
  [trailingSpace]="true"
  (touch)="touch.emit()"
>
  <!-- L'etichetta non cambia: lo stato lo annuncia aria-pressed -->
  <button
    appButton
    type="button"
    variant="text"
    severity="secondary"
    [iconOnly]="true"
    class="absolute right-1 top-1/2 -translate-y-1/2"
    [attr.aria-pressed]="visible()"
    [attr.aria-label]="'inputPassword.show' | transloco"
    (click)="toggle()"
  >
    <ng-icon [name]="visible() ? 'matVisibilityOffOutline' : 'matVisibilityOutline'" size="20" />
  </button>
</app-input-text>
