<app-field-wrapper [label]="label()" [inputId]="inputId()" [errors]="visibleErrors()">
  <input
    #field
    [id]="inputId()"
    [type]="type()"
    [value]="value()"
    [disabled]="disabled()"
    [placeholder]="placeholder() | transloco"
    [attr.autocomplete]="autocomplete() || null"
    [attr.inputmode]="inputmode() || null"
    [attr.aria-invalid]="showError()"
    [attr.aria-describedby]="showError() ? inputId() + '-error' : null"
    (input)="value.set(field.value)"
    (blur)="touch.emit()"
    class="w-full rounded-xl border border-surface-700 bg-surface-950/60 px-4 py-2.5 text-sm text-surface-50 placeholder:text-surface-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400 aria-invalid:border-red-400"
  />
</app-field-wrapper>
