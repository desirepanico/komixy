<div
  class="mx-auto flex min-h-[60dvh] max-w-md flex-col items-center justify-center gap-4 px-4 text-center"
>
  <span
    class="flex size-20 items-center justify-center rounded-full border border-primary-400/20 bg-surface-900 text-primary-300 shadow-lg shadow-surface-950/50 md:size-24"
    aria-hidden="true"
  >
    <ng-icon [name]="icon()" size="40" />
  </span>
  <h2 class="text-base font-bold text-surface-50 md:text-lg">{{ title() }}</h2>
  <p class="text-sm text-surface-400">{{ description() }}</p>
</div>
