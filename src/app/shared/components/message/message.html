<div
  class="flex items-center gap-2.5 rounded-xl border px-3 py-2 text-sm/snug text-surface-100"
  [class]="styles().container"
  [attr.role]="role()"
>
  <!-- Il colore sta sul contenitore: lo stile interno di ng-icon batte le classi text-* messe sull'icona -->
  <span class="flex shrink-0" [class]="styles().iconColor">
    <ng-icon [name]="iconName()" size="18" aria-hidden="true" />
  </span>
  <p class="min-w-0 flex-1">
    @if (toneKey(); as key) {
      <span class="sr-only">{{ key | transloco }}: </span>
    }
    {{ label() }}
    <ng-content />
  </p>
</div>
