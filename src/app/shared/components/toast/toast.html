<!-- Le zone live restano sempre nel DOM: si annuncia solo ciò che si aggiunge a una zona esistente. warn ed error subito, gli altri con calma -->
<div role="status" aria-live="polite" aria-atomic="false">
  @for (toast of toastService.polite(); track toast.id) {
    <ng-container [ngTemplateOutlet]="messaggio" [ngTemplateOutletContext]="{ $implicit: toast }" />
  }
</div>
<div role="alert" aria-live="assertive" aria-atomic="false">
  @for (toast of toastService.assertive(); track toast.id) {
    <ng-container [ngTemplateOutlet]="messaggio" [ngTemplateOutletContext]="{ $implicit: toast }" />
  }
</div>

<ng-template #messaggio let-toast>
  <!-- Letto per intero; il timer si ferma su hover e focus -->
  <div
    aria-atomic="true"
    class="glass-strong pointer-events-auto mb-2 grid grid-cols-[auto_1fr_auto] items-center gap-x-2 rounded-md border px-3 py-2.5"
    [class]="style(toast.severity).container"
    (pointerenter)="toastService.pause(toast.id)"
    (pointerleave)="toastService.resume(toast.id)"
    (focusin)="toastService.pause(toast.id)"
    (focusout)="toastService.resume(toast.id)"
  >
    <ng-icon [name]="style(toast.severity).icon" size="18" aria-hidden="true" />
    <p class="text-base font-semibold">{{ toast.summary }}</p>
    <button
      type="button"
      class="-mr-1 flex size-6 cursor-pointer items-center justify-center rounded-sm transition-colors hover:bg-surface-50/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400"
      [attr.aria-label]="'toast.close' | transloco"
      (click)="toastService.dismiss(toast.id)"
    >
      <ng-icon name="matCloseOutline" size="16" aria-hidden="true" />
    </button>
    <p class="col-start-2 text-sm font-semibold text-surface-50">{{ toast.detail }}</p>
  </div>
</ng-template>
