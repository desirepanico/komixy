@for (toast of toastService.toasts(); track toast.id) {
  <!-- Gli avvisi che chiedono attenzione sono annunciati subito (alert), gli altri con calma (status) -->
  <div
    [attr.role]="toast.severity === 'warn' || toast.severity === 'error' ? 'alert' : 'status'"
    [class]="
      'pointer-events-auto flex items-start gap-3 rounded-xl border p-4 text-sm text-surface-50 shadow-lg ' +
      styles[toast.severity].container
    "
  >
    <span [class]="'mt-px shrink-0 ' + styles[toast.severity].iconColor">
      <ng-icon [name]="styles[toast.severity].icon" size="22" aria-hidden="true" />
    </span>
    <div class="flex-1">
      <p class="font-semibold">{{ toast.summary | transloco: toast.params }}</p>
      <p class="text-surface-200">{{ toast.detail | transloco: toast.params }}</p>
    </div>
    <button
      appButton
      type="button"
      variant="text"
      severity="secondary"
      [iconOnly]="true"
      class="-m-2 size-8! shrink-0 rounded-lg!"
      [attr.aria-label]="'toast.close' | transloco"
      (click)="toastService.dismiss(toast.id)"
    >
      <ng-icon name="matCloseOutline" size="18" />
    </button>
  </div>
}
