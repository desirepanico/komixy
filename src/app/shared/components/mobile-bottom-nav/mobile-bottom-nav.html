<nav
  class="relative grid h-14 grid-cols-5 items-center rounded-full border border-surface-600/60 bg-surface-800/60 glass-strong"
>
  <!-- SINISTRA -->
  <div class="col-span-2 flex items-center justify-around">
    @for (item of navItems.slice(0, 2); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="text-primary-400"
        class="flex flex-col items-center justify-center gap-0.5 transition-colors"
      >
        <ng-icon
          [name]="item.icon"
          size="24"
          class="text-neutral-500"
          routerLinkActive="text-primary-400"
        />

        <span
          class="text-xs font-semibold text-neutral-500"
          routerLinkActive="font-bold text-primary-400"
        >
          {{ item.label | transloco }}
        </span>
      </a>
    }
  </div>

  <!-- SCAN -->
  <div
    class="absolute left-1/2 -top-4 z-10 size-20 -translate-x-1/2 rounded-full border-4 border-surface-800 bg-primary-400 shadow-xl shadow-black/40"
  >
    <a routerLink="/scan" class="flex h-full flex-col items-center justify-center text-primary-900">
      <ng-icon name="matBarcodeScannerOutline" size="24" />

      <span class="text-xs font-semibold">
        {{ 'scan' }}
      </span>
    </a>
  </div>

  <!-- DESTRA -->
  <div class="col-span-2 col-start-4 flex items-center justify-around">
    @for (item of navItems.slice(2); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="text-primary-400 font-bold"
        class="flex flex-col items-center justify-center gap-0.5 text-neutral-500 transition-colors"
      >
        <ng-icon [name]="item.icon" size="24" />

        <span class="text-xs font-semibold">
          {{ item.label | transloco }}
        </span>
      </a>
    }
  </div>
</nav>
