<div
  role="group"
  class="inline-flex gap-0.5 rounded-full border border-primary-400/40 bg-surface-900/80 p-0.5"
  [attr.aria-label]="label() | transloco"
>
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="cursor-pointer rounded-full px-3 py-1.5 text-[13px] font-bold transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-400"
      [class.bg-primary-600]="value() === option.value"
      [class.text-surface-50]="value() === option.value"
      [class.text-primary-300]="value() !== option.value"
      [attr.aria-pressed]="value() === option.value"
      (click)="value.set(option.value)"
    >
      {{ option.label | transloco }}
    </button>
  }
</div>
