@let name = label() | transloco;
<label [attr.for]="inputId()" class="text-sm font-semibold text-surface-100">
  {{ name }}
</label>
<ng-content />
@if (error(); as error) {
  <p [id]="inputId() + '-error'" class="text-sm text-red-400" role="alert">
    {{ error.key | transloco: { name: name, min: error.min } }}
  </p>
}
